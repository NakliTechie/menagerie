<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <!-- Security posture, handoff §8. xterm.js (P3) will load from cdnjs with SRI. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; connect-src 'self' wss: ws:; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" />
  <title>Menagerie</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #161922; --panel-2: #1d212b; --elev: #232834;
      --border: #2a2f3a; --text: #e6e8ec; --muted: #9aa3b2; --faint: #6e7681;
      --accent: #6ea8fe; --accent-press: #5a93e6;
      --green: #3fb950; --yellow: #d29922; --red: #f85149; --grey: #6e7681;
      --radius: 10px; --radius-sm: 7px;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--sans); font-size: 14px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; font-size: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; font-size: inherit; }

    /* ---- top bar ---- */
    .topbar {
      display: flex; align-items: center; gap: 16px;
      height: 52px; padding: 0 16px;
      background: var(--panel); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .wordmark { font-weight: 650; letter-spacing: 0.2px; font-size: 15px; }
    .wordmark .dot { color: var(--accent); }
    .workspace { color: var(--muted); font-size: 13px; }
    .spacer { flex: 1; }
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--elev); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 7px 12px; transition: background .12s, border-color .12s;
    }
    .btn:hover { background: #2a303d; }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #0b0d12; font-weight: 600; }
    .btn.primary:hover { background: var(--accent-press); }
    .btn.ghost { background: transparent; }
    .btn.icon { padding: 7px 9px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ---- layout ---- */
    .main { padding: 18px; max-width: 1500px; margin: 0 auto; }
    .relay-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .relay-chip {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 999px; padding: 5px 12px 5px 10px; font-size: 13px;
    }
    .relay-chip .name { font-weight: 550; }
    .relay-chip .host { color: var(--faint); font-size: 12px; }

    .dot-status { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; background: var(--grey); }
    .s-connected { background: var(--green); box-shadow: 0 0 0 3px rgba(63,185,80,.15); }
    .s-connecting { background: var(--yellow); animation: pulse 1.1s ease-in-out infinite; }
    .s-error { background: var(--red); }
    .s-closed { background: var(--grey); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

    .grid {
      display: grid; gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    }
    .empty {
      border: 1px dashed var(--border); border-radius: var(--radius);
      padding: 48px 24px; text-align: center; color: var(--muted);
      background: linear-gradient(180deg, var(--panel), transparent);
    }
    .empty h2 { color: var(--text); font-size: 16px; font-weight: 600; margin: 0 0 6px; }
    .empty p { margin: 0 0 16px; }

    /* ---- modal ---- */
    .scrim {
      position: fixed; inset: 0; background: rgba(0,0,0,.55);
      display: none; align-items: flex-start; justify-content: center;
      padding: 64px 16px; z-index: 50; backdrop-filter: blur(2px);
    }
    .scrim.open { display: flex; }
    .modal {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius); width: 100%; max-width: 460px;
      box-shadow: 0 16px 48px rgba(0,0,0,.5); overflow: hidden;
    }
    .modal header {
      display: flex; align-items: center; padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .modal header h2 { margin: 0; font-size: 15px; font-weight: 600; }
    .modal .body { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .modal .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); margin-bottom: 8px; }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 12.5px; color: var(--muted); }
    .field input, .field select, .field textarea {
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 8px 10px; outline: none; width: 100%;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 64px; }
    .hint { font-size: 12px; color: var(--faint); }
    .row { display: flex; gap: 8px; align-items: flex-end; }
    .row .field { flex: 1; }

    .note {
      font-size: 12.5px; color: var(--muted);
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 9px 11px;
    }
    .inline-error { color: var(--red); font-size: 12.5px; min-height: 1em; }
    .inline-ok { color: var(--green); font-size: 12.5px; min-height: 1em; }

    .relay-list { display: flex; flex-direction: column; gap: 8px; }
    .relay-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 9px 11px;
    }
    .relay-row .meta { flex: 1; min-width: 0; }
    .relay-row .meta .n { font-weight: 550; }
    .relay-row .meta .u { color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .link { color: var(--accent); background: none; border: none; padding: 0; }
    .link.danger { color: var(--red); }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="wordmark">Menagerie<span class="dot">.</span></span>
    <span class="workspace" id="workspace">in-memory (FSA persistence: P4)</span>
    <span class="spacer"></span>
    <button class="btn primary" id="spawnBtn">+ Spawn</button>
    <button class="btn icon ghost" id="settingsBtn" title="Settings" aria-label="Settings">⚙</button>
  </div>

  <main class="main">
    <div class="relay-strip" id="relayStrip"></div>
    <div class="grid" id="grid"></div>
  </main>

  <!-- Settings -->
  <div class="scrim" id="settingsScrim" data-close>
    <div class="modal" role="dialog" aria-label="Settings">
      <header><h2>Settings</h2><span class="spacer"></span><button class="btn icon ghost" data-close>✕</button></header>
      <div class="body">
        <div>
          <div class="section-title">Workspace</div>
          <div class="note">FSA persistence lands in P4. For now relays live in memory and are cleared on reload.</div>
        </div>
        <div>
          <div class="section-title">Relays</div>
          <div class="relay-list" id="relayList"></div>
          <div style="height:10px"></div>
          <div class="field">
            <label for="relayUrl">Relay URL</label>
            <input id="relayUrl" placeholder="ws://127.0.0.1:7878" autocomplete="off" spellcheck="false" />
          </div>
          <div style="height:10px"></div>
          <div class="field">
            <label for="relayToken">Registration token</label>
            <input id="relayToken" placeholder="paste from `menagerie-relay token print`" autocomplete="off" spellcheck="false" />
          </div>
          <div style="height:10px"></div>
          <div class="row">
            <button class="btn primary" id="addRelayBtn">Add relay</button>
          </div>
          <div style="height:6px"></div>
          <div class="inline-error" id="addRelayError"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Spawn -->
  <div class="scrim" id="spawnScrim" data-close>
    <div class="modal" role="dialog" aria-label="Spawn agent">
      <header><h2>Spawn agent</h2><span class="spacer"></span><button class="btn icon ghost" data-close>✕</button></header>
      <div class="body">
        <div class="field">
          <label for="spawnRelay">Relay</label>
          <select id="spawnRelay"></select>
        </div>
        <div class="field">
          <label for="spawnAgent">Agent</label>
          <select id="spawnAgent"></select>
        </div>
        <div class="field" id="customCmdField" style="display:none">
          <label for="spawnCustomCmd">Custom command</label>
          <input id="spawnCustomCmd" placeholder="e.g. aider --model gpt-4o" autocomplete="off" spellcheck="false" />
        </div>
        <div class="field">
          <label for="spawnCwd">Working directory</label>
          <input id="spawnCwd" placeholder="/Users/you/code/project" autocomplete="off" spellcheck="false" />
        </div>
        <div class="field">
          <label for="spawnTask">Task</label>
          <textarea id="spawnTask" placeholder="what should the agent do?"></textarea>
        </div>
        <div class="row"><button class="btn primary" id="doSpawnBtn">Spawn</button></div>
        <div class="inline-error" id="spawnResult"></div>
      </div>
    </div>
  </div>

  <script type="module">
    // ---- Menagerie app shell (P2) --------------------------------------
    // In-memory state only. FSA persistence (relays.json, sessions) is P4.
    // Live tiles + xterm.js are P3. This shell does the hello+register
    // round-trip and a spawn dialog that surfaces the relay's response.

    const PROTOCOL_VERSION = "1.0";
    /** @type {{id:string,url:string,token:string,ws:WebSocket|null,status:string,name:string,hello:any,error:string|null}[]} */
    const relays = [];
    const pendingSpawns = new Map(); // client_id -> true

    const $ = (id) => document.getElementById(id);

    // ---- relay connection ----
    function addRelay(url, token) {
      const relay = { id: crypto.randomUUID(), url, token, ws: null, status: "connecting", name: url, hello: null, error: null };
      relays.push(relay);
      connect(relay);
      renderAll();
      return relay;
    }

    function connect(relay) {
      let ws;
      try { ws = new WebSocket(relay.url); }
      catch (e) { relay.status = "error"; relay.error = "bad URL: " + e.message; renderAll(); return; }
      relay.ws = ws;
      relay.status = "connecting";
      relay.error = null;
      ws.addEventListener("message", (ev) => {
        let msg; try { msg = JSON.parse(ev.data); } catch { return; }
        handleMessage(relay, msg);
      });
      ws.addEventListener("close", () => {
        if (relay.status !== "error") relay.status = "closed";
        renderAll();
      });
      ws.addEventListener("error", () => { /* close event follows with detail */ });
    }

    function handleMessage(relay, msg) {
      switch (msg.type) {
        case "hello":
          relay.hello = msg;
          relay.name = msg.relay_name || relay.url;
          if (msg.protocol_version && msg.protocol_version !== PROTOCOL_VERSION) {
            console.warn(`relay protocol ${msg.protocol_version} != app ${PROTOCOL_VERSION}; attempting anyway`);
          }
          send(relay, { type: "register", registration_token: relay.token });
          break;
        case "registered":
          relay.status = "connected";
          relay.error = null;
          break;
        case "error":
          if (msg.code === "auth_failed") {
            relay.status = "error";
            relay.error = msg.message || "authentication failed";
            try { relay.ws.close(); } catch {}
          } else if (msg.session_id === undefined && pendingSpawnsActive()) {
            showSpawnResult(msg.message || msg.code, false);
          } else {
            // spawn/other errors surface in the spawn dialog if open
            showSpawnResult((msg.code || "error") + ": " + (msg.message || ""), false);
          }
          break;
        case "spawned":
          // Not reachable until P3 (relay has no PTY yet), but handle gracefully.
          showSpawnResult("spawned " + msg.agent + " (session " + msg.session_id + ")", true);
          break;
      }
      renderAll();
    }

    function pendingSpawnsActive() { return pendingSpawns.size > 0; }

    function send(relay, obj) {
      if (relay.ws && relay.ws.readyState === WebSocket.OPEN) relay.ws.send(JSON.stringify(obj));
    }

    function removeRelay(id) {
      const i = relays.findIndex((r) => r.id === id);
      if (i < 0) return;
      try { relays[i].ws && relays[i].ws.close(); } catch {}
      relays.splice(i, 1);
      renderAll();
    }

    function spawn(relayId, agent, cwd, task, customCmd) {
      const relay = relays.find((r) => r.id === relayId);
      if (!relay || relay.status !== "connected") { showSpawnResult("relay not connected", false); return; }
      const client_id = crypto.randomUUID();
      pendingSpawns.set(client_id, true);
      // Task goes through as args; the shim decides formatting (no per-agent
      // special-casing in the browser — hard NOT #6). custom carries its command.
      const args = agent === "custom"
        ? (customCmd ? customCmd.split(/\s+/) : [])
        : (task ? [task] : []);
      send(relay, { type: "spawn", agent, cwd, args, env: {}, client_id });
      showSpawnResult("spawn sent…", true);
    }

    // ---- rendering ----
    function statusClass(s) { return "s-" + s; }

    function renderRelayStrip() {
      const el = $("relayStrip");
      el.innerHTML = "";
      for (const r of relays) {
        const chip = document.createElement("div");
        chip.className = "relay-chip";
        const dot = document.createElement("span");
        dot.className = "dot-status " + statusClass(r.status);
        const name = document.createElement("span");
        name.className = "name"; name.textContent = r.name;
        const host = document.createElement("span");
        host.className = "host";
        host.textContent = r.hello ? `${r.hello.host_os}/${r.hello.host_arch}` : r.status;
        chip.append(dot, name, host);
        el.appendChild(chip);
      }
    }

    function renderGrid() {
      const el = $("grid");
      el.innerHTML = "";
      const connected = relays.some((r) => r.status === "connected");
      const empty = document.createElement("div");
      empty.className = "empty";
      if (relays.length === 0) {
        empty.innerHTML = `<h2>No relays yet</h2><p>Add a relay in Settings to connect to where your agents run.</p>`;
        const b = document.createElement("button");
        b.className = "btn"; b.textContent = "Open Settings";
        b.addEventListener("click", () => openModal("settingsScrim"));
        empty.appendChild(b);
      } else if (!connected) {
        empty.innerHTML = `<h2>No connected relays</h2><p>Check the relay is running and the token matches.</p>`;
      } else {
        empty.innerHTML = `<h2>No agents running</h2><p>Click <strong>+ Spawn</strong> to start one. (Live tiles arrive in P3.)</p>`;
      }
      el.appendChild(empty);
    }

    function renderRelayList() {
      const el = $("relayList");
      el.innerHTML = "";
      if (relays.length === 0) {
        const none = document.createElement("div");
        none.className = "hint"; none.textContent = "No relays added yet.";
        el.appendChild(none);
        return;
      }
      for (const r of relays) {
        const row = document.createElement("div");
        row.className = "relay-row";
        const dot = document.createElement("span");
        dot.className = "dot-status " + statusClass(r.status);
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = `<div class="n"></div><div class="u"></div>`;
        meta.querySelector(".n").textContent = r.name + (r.error ? ` — ${r.error}` : "");
        meta.querySelector(".u").textContent = r.url;
        const rm = document.createElement("button");
        rm.className = "link danger"; rm.textContent = "Remove";
        rm.addEventListener("click", () => removeRelay(r.id));
        row.append(dot, meta, rm);
        el.appendChild(row);
      }
    }

    function renderSpawnDialog() {
      const relaySel = $("spawnRelay");
      const agentSel = $("spawnAgent");
      const prev = relaySel.value;
      relaySel.innerHTML = "";
      const connected = relays.filter((r) => r.status === "connected");
      for (const r of connected) {
        const o = document.createElement("option");
        o.value = r.id; o.textContent = r.name; relaySel.appendChild(o);
      }
      if (connected.length && connected.some((r) => r.id === prev)) relaySel.value = prev;
      renderAgentOptions();
      $("doSpawnBtn").disabled = connected.length === 0;
    }

    function renderAgentOptions() {
      const agentSel = $("spawnAgent");
      agentSel.innerHTML = "";
      const r = relays.find((x) => x.id === $("spawnRelay").value);
      const agents = (r && r.hello && r.hello.agents) ? r.hello.agents : [];
      for (const a of agents) {
        const o = document.createElement("option");
        o.value = a; o.textContent = a; agentSel.appendChild(o);
      }
      $("customCmdField").style.display = agentSel.value === "custom" ? "" : "none";
    }

    function renderAll() {
      renderRelayStrip();
      renderGrid();
      renderRelayList();
      if ($("spawnScrim").classList.contains("open")) renderSpawnDialog();
    }

    // ---- modals ----
    function openModal(id) {
      $(id).classList.add("open");
      if (id === "spawnScrim") { renderSpawnDialog(); $("spawnResult").textContent = ""; }
    }
    function closeModal(id) { $(id).classList.remove("open"); }
    function closeAllModals() { document.querySelectorAll(".scrim").forEach((s) => s.classList.remove("open")); }

    function showSpawnResult(text, ok) {
      const el = $("spawnResult");
      el.textContent = text;
      el.className = ok ? "inline-ok" : "inline-error";
    }

    // ---- wiring ----
    $("settingsBtn").addEventListener("click", () => openModal("settingsScrim"));
    $("spawnBtn").addEventListener("click", () => openModal("spawnScrim"));
    $("spawnRelay").addEventListener("change", renderAgentOptions);
    $("spawnAgent").addEventListener("change", () => {
      $("customCmdField").style.display = $("spawnAgent").value === "custom" ? "" : "none";
    });

    $("addRelayBtn").addEventListener("click", () => {
      const url = $("relayUrl").value.trim();
      const token = $("relayToken").value.trim();
      const err = $("addRelayError");
      err.textContent = "";
      if (!/^wss?:\/\//.test(url)) { err.textContent = "URL must start with ws:// or wss://"; return; }
      if (!token) { err.textContent = "Registration token is required."; return; }
      addRelay(url, token);
      $("relayUrl").value = ""; $("relayToken").value = "";
    });

    $("doSpawnBtn").addEventListener("click", () => {
      spawn($("spawnRelay").value, $("spawnAgent").value, $("spawnCwd").value.trim(), $("spawnTask").value.trim(), $("spawnCustomCmd").value.trim());
    });

    document.querySelectorAll("[data-close]").forEach((el) => {
      el.addEventListener("click", (e) => { if (e.target === el) closeAllModals(); });
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeAllModals();
      else if (e.key === "n" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !anyModalOpen()) openModal("spawnScrim");
    });
    function anyModalOpen() { return [...document.querySelectorAll(".scrim")].some((s) => s.classList.contains("open")); }

    renderAll();
    // Expose for manual testing in the console.
    window.__menagerie = { relays, addRelay };
  </script>
</body>
</html>
